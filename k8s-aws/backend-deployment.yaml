# =============================================================================
# k8s-aws/backend-deployment.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscart-backend
  namespace: campuscart
  labels:
    app: campuscart-backend
spec:
  replicas: 2 # matches our EKS node_desired_size=2 reasoning — at least 2, so a single pod restart/node interruption never takes the whole backend offline

  # -------------------------------------------------------------------------
  # THIS selector/template label pairing is not decoration — it's the
  # literal mechanism a Deployment uses to know WHICH pods belong to it.
  # Get these mismatched, and the Deployment either manages the wrong pods
  # or, more commonly, none at all.
  # -------------------------------------------------------------------------
  selector:
    matchLabels:
      app: campuscart-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # NEVER drop below full replica count during a deploy — a new pod must be ready BEFORE an old one is removed
      maxSurge: 1        # allowed to temporarily run ONE extra pod above `replicas` while rolling out, to make that zero-unavailable guarantee possible

  template:
    metadata:
      labels:
        app: campuscart-backend
    spec:
      serviceAccountName: campuscart-app-sa
      containers:
        - name: backend
          # This ${...} pattern is the same envsubst templating approach
          # from the ConfigMap step — the real ECR URL + image tag only
          # exist after `terraform apply` and after Jenkins builds/pushes
          # a specific tag, so this stays a placeholder here in git.
          image: "${ECR_BACKEND_IMAGE}:${IMAGE_TAG}"
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: campuscart-config   # everything from configmap.yaml, injected as env vars
            - secretRef:
                name: campuscart-db-secret # DB_PASSWORD, synced by ESO — same mechanism, injected as env vars

          # ---------------------------------------------------------------
          # RESOURCE REQUESTS AND LIMITS — genuinely one of the most
          # commonly skipped, most consequential settings in any real
          # cluster. Explained in full below the YAML.
          # ---------------------------------------------------------------
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ---------------------------------------------------------------
          # PROBES — how Kubernetes actually knows if your app is healthy.
          # Explained in full below.
          # ---------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          # ---------------------------------------------------------------
          # SECURITY CONTEXT — running as a non-root user inside the
          # container. Explained below.
          # ---------------------------------------------------------------
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Django needs to write things like collected static files/media at runtime in this setup; a stricter setup would mount a dedicated writable volume instead and set this to true