# =============================================================================
# k8s-aws/externalsecret.yaml
# =============================================================================
# This is the resource that ACTUALLY triggers a sync. ESO watches for
# ExternalSecret objects, reads .spec.data[].remoteRef to know which real
# secret to fetch, and creates/updates a native Secret named in
# .spec.target.name — living in whatever namespace THIS ExternalSecret
# object is deployed into (campuscart, in our case).
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: campuscart-db-secret
  namespace: campuscart
spec:
  refreshInterval: 1h # how often ESO re-checks Secrets Manager for a changed value and re-syncs — 1h is a sensible default; tighten this if you expect frequent rotation
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: campuscart-db-secret # the NATIVE k8s Secret this creates
    creationPolicy: Owner # ESO fully owns this Secret's lifecycle — if you delete the ExternalSecret, the Secret it created gets cleaned up too, not left orphaned

  data:
    - secretKey: DB_PASSWORD # the KEY inside the resulting k8s Secret
      remoteRef:
        key: campuscart-db-password # must match the Secrets Manager secret's NAME — we'll wire this as a real Terraform output value, not hand-typed, in the next step