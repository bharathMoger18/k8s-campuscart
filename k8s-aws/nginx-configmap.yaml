# =============================================================================
# k8s-aws/nginx-configmap.yaml
# =============================================================================
# HTTP-only nginx config for EKS. The image bakes in nginx/nginx.conf, which is for the kubeadm
# deployment: it needs TLS certs and an upstream called "web". This ConfigMap is mounted over that
# file by nginx-deployment.yaml. Add TLS at the ALB later (ACM certificate), not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: campuscart-nginx-conf
  namespace: campuscart
data:
  campuscart.conf: |
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream campuscart_backend {
        server campuscart-backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    server {
        listen 8080;
        server_name _;
        server_tokens off;
        gzip on;
        gzip_types text/css application/javascript application/json text/plain application/xml;
        gzip_min_length 1024;
        gzip_comp_level 5;
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; frame-src https://js.stripe.com; connect-src 'self';";
        client_max_body_size 20M;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_body_timeout 12s;
        client_header_timeout 12s;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        access_log /dev/stdout;
        error_log /dev/stderr warn;

        root /app/frontend;
        index index.html;

        # Answered by nginx itself: used by the pod probes and by the ALB health check.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://campuscart_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://campuscart_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /admin/ {
            proxy_pass http://campuscart_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # No shared volume on EKS (kubeadm aliases /app/staticfiles), so ask the backend (whitenoise).
        location /static/ {
            proxy_pass http://campuscart_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
