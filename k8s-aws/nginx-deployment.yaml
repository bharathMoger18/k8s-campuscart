# =============================================================================
# k8s-aws/nginx-deployment.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscart-nginx
  namespace: campuscart
  labels:
    app: campuscart-nginx
spec:
  replicas: 2

  selector:
    matchLabels:
      app: campuscart-nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: campuscart-nginx
    spec:
      automountServiceAccountToken: false # this workload never calls the Kubernetes API
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "${ECR_NGINX_IMAGE}:${IMAGE_TAG}"
          imagePullPolicy: Always

          ports:
            - containerPort: 8080 # non-root (uid 101) cannot bind port 80
              name: http

          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/campuscart.conf
              subPath: campuscart.conf
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          securityContext:
            runAsNonRoot: true
            runAsUser: 101 # nginx's own conventional non-root UID inside the official nginx image
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: nginx-conf
          configMap:
            name: campuscart-nginx-conf
