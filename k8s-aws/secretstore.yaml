# =============================================================================
# k8s-aws/secretstore.yaml
# =============================================================================
# A SecretStore (or its cluster-scoped cousin, ClusterSecretStore) tells
# the External Secrets Operator WHERE to fetch secrets FROM, and HOW to
# authenticate. We're using ClusterSecretStore specifically because it's
# not tied to one namespace — any ExternalSecret in any namespace can
# reference it, which matters if you later add more apps to this cluster
# that also need AWS secrets.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        # jwt = "use this cluster's ServiceAccount token, exchanged via
        # IRSA, to authenticate" — NOT static AWS keys. This is the exact
        # ServiceAccount the Helm chart created and annotated with our
        # eso_irsa role ARN in the previous step.
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets