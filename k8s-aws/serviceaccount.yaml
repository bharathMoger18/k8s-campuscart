# =============================================================================
# k8s-aws/serviceaccount.yaml
# =============================================================================
# A dedicated ServiceAccount for our application pods, instead of letting
# them run under the implicit "default" ServiceAccount every namespace
# gets automatically. Explained below.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campuscart-app-sa
  namespace: campuscart
automountServiceAccountToken: false