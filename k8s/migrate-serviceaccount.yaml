# Add this to k8s/serviceaccounts.yaml, as a new document alongside the
# existing web/nginx/postgres/redis ones from Session 1.
#
# Token stays mounted (default) — same reason as "web": this identity
# needs to authenticate to Vault via its own ServiceAccount token.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: k8s-campuscart
  labels:
    app: migrate
# token intentionally left mounted (default true) - needed for Vault auth