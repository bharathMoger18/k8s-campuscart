# nginx.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: k8s-campuscart
spec:
  # NodePort: on a bare-metal kubeadm cluster (no cloud provider), there's
  # no automatic external load balancer the way there is on EKS/GKE. NodePort
  # is the standard bare-metal answer — it opens the SAME port on every node
  # in the cluster, and traffic hitting any node on that port gets routed to
  # this Service. (The more advanced real-world answer is MetalLB for true
  # LoadBalancer support, or an Ingress controller — both worth knowing by
  # name for an interview, even though NodePort is what we're using here.)
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: k8s-campuscart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: 192.168.1.3:5000/campuscart-nginx:37be2f9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"