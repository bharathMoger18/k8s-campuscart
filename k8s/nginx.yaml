# nginx.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: k8s-campuscart
spec:
  # Switched from NodePort to ClusterIP: traffic now arrives exclusively
  # via the ingress-nginx controller -> this Service's ClusterIP (see
  # campuscart-monolith-ingress). NodePort/30081 was dead weight once
  # the ingress path existed — one less open port on every node.
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: k8s-campuscart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx
      containers:
        - name: nginx
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          image: 192.168.1.3:5000/campuscart-nginx:${NGINX_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: nginx-run
              mountPath: /run
            - name: campuscart-shared
              mountPath: /app/staticfiles
              subPath: staticfiles
            - name: campuscart-shared
              mountPath: /app/media
              subPath: media
            - name: nginx-tls
              mountPath: /etc/nginx/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: nginx-run
          emptyDir: {}
        - name: campuscart-shared
          persistentVolumeClaim:
            claimName: campuscart-shared
        - name: nginx-tls
          secret:
            secretName: nginx-backend-tls