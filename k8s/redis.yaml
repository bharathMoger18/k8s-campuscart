# redis.yaml
# Redis here backs Django Channels (WebSocket group state) — losing it on
# a restart just means active chat/notification connections reset, not
# real data loss. That's why this is a plain Deployment with no persistent
# volume, unlike Postgres.

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: k8s-campuscart
  labels:
    app: redis
spec:
  # A normal (non-headless) Service is fine here — Django doesn't need to
  # address a specific Redis replica, just "the Redis service," so a single
  # stable virtual IP/DNS name is exactly right.
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: k8s-campuscart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

        # ------------------------------------------------------------------
        # redis_exporter sidecar — same pattern as postgres_exporter: a
        # separate process translating Redis's native INFO command output
        # into Prometheus format. No auth configured on this Redis, so no
        # secrets/connection-string assembly needed — just point at
        # localhost, same pod network namespace as the postgres_exporter
        # setup.
        # ------------------------------------------------------------------
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"