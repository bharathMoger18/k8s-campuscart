# k8s/serviceaccounts.yaml
# One identity per workload in k8s-campuscart.
#
# WHY: every pod currently runs as "default", so the API server (and later
# Vault) cannot tell web / nginx / postgres / redis apart. A dedicated
# ServiceAccount per workload gives each one its own identity to audit
# and to bind policies to.
#
# automountServiceAccountToken: false  ->  the pod does NOT get a
# Kubernetes API token mounted at /var/run/secrets/kubernetes.io/...
# nginx, redis and postgres never call the K8s API, so the token is
# pure attack surface for them.
#
# web is different: Vault's Kubernetes auth proves web's identity by
# presenting its ServiceAccount token, so web KEEPS the token mounted.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: k8s-campuscart
  labels:
    app: web
# token intentionally left mounted (default true) - needed for Vault auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
  namespace: k8s-campuscart
  labels:
    app: nginx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: k8s-campuscart
  labels:
    app: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: k8s-campuscart
  labels:
    app: redis
automountServiceAccountToken: false