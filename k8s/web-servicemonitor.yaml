apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: campuscart-web
  namespace: k8s-campuscart
  labels:
    app: web
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: web
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - k8s-campuscart
