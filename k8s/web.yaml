# web.yaml
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-campuscart
  labels:
    app: web
spec:
  # ClusterIP (the default): only reachable from WITHIN the cluster.
  # nginx is the only thing that should ever talk to Django directly —
  # the outside world only ever reaches nginx.
  selector:
    app: web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-campuscart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        # --- Vault Agent Injector (Session 2b) ---
        # This is what tells the injector's mutating webhook to add
        # init + sidecar containers to this pod. Nothing below does
        # anything without this being "true".
        vault.hashicorp.com/agent-inject: "true"

        # The Vault role bound to the "web" ServiceAccount — see
        # auth/kubernetes/role/campuscart-web.
        vault.hashicorp.com/role: "campuscart-web"

        # Vault's Service, confirmed via `kubectl get svc -n vault`.
        vault.hashicorp.com/service: "https://vault.vault.svc.cluster.local:8200"

        # Trust our private CA instead of skipping verification.
        # agent-extra-secret mounts the k8s Secret "vault-ca-cert"
        # (a manual copy of cert-manager's campuscart-ca-secret) into
        # the agent sidecar; ca-cert points at the file inside it.
        vault.hashicorp.com/agent-extra-secret: "vault-ca-cert"
        # Confirmed twice now from the live pod's actual volumeMounts:
        # the extra-secrets volume mounts directly at /vault/custom —
        # there is NO subdirectory named after the secret. The secret's
        # own key (ca.crt) lands straight at /vault/custom/ca.crt.
        # Got this wrong twice by assuming a nesting structure that
        # doesn't exist; this path is read directly off the pod spec.
        vault.hashicorp.com/ca-cert: "/vault/custom/ca.crt"

        # Four Vault reads, rendered into ONE file so entrypoint.sh
        # only has to source one path: /vault/secrets/campuscart.env
        vault.hashicorp.com/agent-inject-secret-campuscart.env: "secret/data/campuscart/django"
        vault.hashicorp.com/agent-inject-template-campuscart.env: |
          {{- with secret "secret/data/campuscart/django" -}}
          DJANGO_SECRET_KEY={{ .Data.data.DJANGO_SECRET_KEY }}
          {{ end }}
          {{- with secret "secret/data/campuscart/email" -}}
          EMAIL_HOST_USER={{ .Data.data.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD={{ .Data.data.EMAIL_HOST_PASSWORD }}
          {{ end }}
          {{- with secret "secret/data/campuscart/stripe" -}}
          STRIPE_PUBLISHABLE_KEY={{ .Data.data.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY={{ .Data.data.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET={{ .Data.data.STRIPE_WEBHOOK_SECRET }}
          {{ end }}
          {{- with secret "secret/data/campuscart/vapid" -}}
          VAPID_PUBLIC_KEY={{ .Data.data.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY={{ .Data.data.VAPID_PRIVATE_KEY }}
          {{ end }}

        # Owner-read-only — this file holds every static secret the
        # app needs.
        vault.hashicorp.com/agent-inject-perms-campuscart.env: "0400"

        # --- Dynamic database credentials (Session 2c) ---
        # A SEPARATE file from campuscart.env on purpose: this one's
        # contents genuinely change at runtime — Vault Agent watches
        # this secret's lease and re-renders the file with a brand-new
        # generated user when it renews or expires (default_ttl=1h).
        # campuscart.env never changes after being written once.
        vault.hashicorp.com/agent-inject-secret-db-creds.env: "database/creds/campuscart-app"
        vault.hashicorp.com/agent-inject-template-db-creds.env: |
          {{- with secret "database/creds/campuscart-app" -}}
          DB_USER={{ .Data.username }}
          DB_PASSWORD={{ .Data.password }}
          {{ end }}
        vault.hashicorp.com/agent-inject-perms-db-creds.env: "0400"
    spec:
      serviceAccountName: web
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          # Pinned to the exact commit-SHA tag Kaniko built and pushed —
          # NOT ':latest'. Kubernetes treats ':latest' specially: its
          # default imagePullPolicy is ALWAYS re-pull, every single Pod
          # start, even if nothing changed — slower, and worse, it means
          # "what's actually running" can silently drift over time since
          # latest a moment ago might not be latest now. A specific tag
          # is reproducible: this exact Deployment always means this
          # exact, known image, forever.
          #
          # NOTE: this tag is currently stale — the pod actually running
          # in the cluster is on f53956d, not this. Needs the sed/commit
          # fix from Session 1, separate from this Vault change.
          image: 192.168.1.3:5000/campuscart-web:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: campuscart-shared
              mountPath: /app/staticfiles
              subPath: staticfiles
            - name: campuscart-shared
              mountPath: /app/media
              subPath: media
          envFrom:
            - configMapRef:
                name: campuscart-config
            # Kept intentionally for now — DB_USER/DB_PASSWORD/DB_NAME
            # haven't moved to Vault yet (that's Session 2c, dynamic
            # Postgres credentials). Everything else this Secret held
            # (Django key, email, Stripe, VAPID) is now ALSO available
            # via the Vault-rendered file below; once 2c is done and
            # web.yaml is proven working entirely off Vault, this
            # secretRef comes out and campuscart-secrets gets deleted.
            - secretRef:
                name: campuscart-secrets
          # startupProbe: gives the container up to 300s (30 x 10s) to
          # finish migrations/collectstatic before readiness/liveness
          # even start being checked — without this, a slow first boot
          # could get liveness-killed before it ever finished starting.
          startupProbe:
            httpGet:
              path: /api/v1/products/
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/products/
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: campuscart-shared
          persistentVolumeClaim:
            claimName: campuscart-shared